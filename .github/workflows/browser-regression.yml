name: Browser Regression

on:
  push:
    branches: [dev, preview/uat]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  isolated-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise isolated payment and Insights flows
        run: node scripts/browser-regression.cjs
        env:
          MGW_TEST_ARTIFACTS: browser-test-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-ui-screenshots
          path: browser-test-artifacts
          if-no-files-found: ignore
