name: Deploy MoneyGoWhere Preview UAT to GitHub Pages

on:
  push:
    branches: ["preview/uat"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-preview-uat"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Preview UAT
        uses: actions/checkout@v6
        with:
          ref: preview/uat
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Preview UAT artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy Preview UAT to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
