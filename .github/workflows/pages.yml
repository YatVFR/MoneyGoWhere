name: Deploy MoneyGoWhere UAT to GitHub Pages

on:
  push:
    branches: ["preview/uat"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-shared-preview"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}uat/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Production snapshot
        uses: actions/checkout@v6
        with:
          ref: main
          path: prod-src

      - name: Checkout UAT snapshot
        uses: actions/checkout@v6
        with:
          ref: preview/uat
          path: uat-src

      - name: Checkout Dev snapshot
        uses: actions/checkout@v6
        with:
          ref: dev
          path: dev-src

      - name: Generate UAT PWA icon set
        shell: bash
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then
            IM=magick
          elif command -v convert >/dev/null 2>&1; then
            IM=convert
          else
            sudo apt-get update -y
            sudo apt-get install -y imagemagick
            IM=convert
          fi
          SRC="uat-src/assets/icons/icon.svg"
          test -s "$SRC"
          mkdir -p uat-src/assets/icons
          "$IM" "$SRC" -resize 180x180! -strip uat-src/assets/icons/apple-touch-icon.png
          "$IM" "$SRC" -resize 192x192! -strip uat-src/assets/icons/icon-192.png
          "$IM" "$SRC" -resize 256x256! -strip uat-src/assets/icons/icon-256.png
          "$IM" "$SRC" -resize 384x384! -strip uat-src/assets/icons/icon-384.png
          "$IM" "$SRC" -resize 512x512! -strip uat-src/assets/icons/icon-512.png
          "$IM" -size 512x512 xc:'#011a22' \( "$SRC" -resize 380x380! \) -gravity center -composite -strip uat-src/assets/icons/icon-512-maskable.png
          identify uat-src/assets/icons/apple-touch-icon.png \
                   uat-src/assets/icons/icon-192.png \
                   uat-src/assets/icons/icon-256.png \
                   uat-src/assets/icons/icon-384.png \
                   uat-src/assets/icons/icon-512.png \
                   uat-src/assets/icons/icon-512-maskable.png

      - name: Assemble shared Pages site
        run: |
          mkdir -p site site/uat site/dev
          rsync -a --delete --exclude='.git' --exclude='.github' prod-src/ site/
          mkdir -p site/uat site/dev
          rsync -a --delete --exclude='.git' --exclude='.github' uat-src/ site/uat/
          rsync -a --delete --exclude='.git' --exclude='.github' dev-src/ site/dev/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload shared Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy UAT snapshot
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
