name: Data Boundary Guard

on:
  push:
    branches: [dev, uat, main]
  pull_request:
    branches: [dev, uat, main]

jobs:
  prevent-personal-data-in-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked personal database/backup files
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -Ei '(^|/)(private-data|local-data|user-data)(/|$)|(^|/)data/(private|imports)/|\.sqlite(3)?$|\.db$|(^|/).*backup.*\.json$|(^|/)MoneyGoWhere[_-].*\.json$' || true)
          if [ -n "$bad" ]; then
            echo "Personal/local database artifacts must not be committed:"
            echo "$bad"
            exit 1
          fi
      - name: Reject known imported-finance record markers in application source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' --exclude='*.yml' --exclude='*.yaml' \
            'legacy_finance_pdf|LEGACY-[0-9]{4}-[0-9]{2}-(INCOME|SAVINGS|DBS-LOAN|OCBC-LOAN|SC-LOAN)|FINANCES-2022\.pdf' .; then
            echo "Imported finance records or source-specific markers were found in application files. Keep them in the user database only."
            exit 1
          fi
      - name: Verify base database starts empty
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('app.js').read_text(encoding='utf-8')
          required = ['expenses:[]', 'income:[]']
          missing = [x for x in required if x not in src.replace(' ', '')]
          if missing:
              raise SystemExit('Base DB no longer clearly initializes empty: ' + ', '.join(missing))
          print('Data boundary check passed: base finance collections initialize empty.')
          PY
