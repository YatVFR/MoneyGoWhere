name: Release Readiness Smoke

on:
  push:
    branches: [dev, uat, main]
  pull_request:

permissions:
  contents: read

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: MoneyGoWhere release smoke tests
        run: node scripts/release-smoke.mjs

      - name: Data integrity regression tests
        run: node scripts/integrity-regression.mjs

      - name: Recurring review and archive regression tests
        run: node scripts/recurring-review-regression.mjs

      - name: Editing position regression tests
        run: node scripts/editing-position-regression.mjs

      - name: Wallet matching and preservation regression tests
        run: node scripts/wallet-matching-regression.mjs

      - name: Shared wallet balance regression tests
        run: node scripts/wallet-balances-regression.mjs

      - name: Wallet balance save-form regression tests
        run: node scripts/wallet-balance-forms-regression.mjs

      - name: Settings grouping and import preference regression tests
        run: node scripts/settings-layout-regression.mjs

      - name: Receipt review, crop, PDF text and OCR queue regressions
        run: node scripts/receipt-review-regression.mjs
