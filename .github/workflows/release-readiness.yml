name: Release Readiness Smoke

on:
  push:
    branches: [dev, uat, main]
  pull_request:

permissions:
  contents: read

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: MoneyGoWhere release smoke tests
        run: node scripts/release-smoke.mjs
